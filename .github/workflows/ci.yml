name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  STORYBOOK_DISABLE_TELEMETRY: 1
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # fallow audit diffs against the PR's base branch, so it needs history.
          fetch-depth: 0
      # Reads the pnpm version from package.json's packageManager field.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check
      - name: Lint
        run: pnpm lint --format github
      - name: Typecheck
        run: pnpm typecheck
      - name: Fallow audit (findings this PR introduces)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: pnpm fallow audit --base "origin/$BASE_REF" --format github-annotations

      - name: Install Chromium for story tests
        run: pnpm --filter storybook exec playwright install --with-deps chromium
      - name: Unit and story tests
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Build Storybook
        run: pnpm build-storybook

      - name: Upload failed-story screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failed-story-screenshots
          path: apps/storybook/**/__screenshots__/
          if-no-files-found: ignore
      - name: Upload Storybook
        uses: actions/upload-artifact@v7
        with:
          name: storybook-static
          path: apps/storybook/storybook-static/
