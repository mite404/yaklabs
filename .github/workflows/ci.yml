name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 7 * * *"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  STORYBOOK_DISABLE_TELEMETRY: 1
  TURBO_TELEMETRY_DISABLED: 1
  # Nightly main runs execute every task, even when its hash is cached.
  TURBO_FORCE: ${{ github.event_name == 'schedule' && 'true' || 'false' }}
  TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha }}
  TURBO_SCM_HEAD: ${{ github.sha }}

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # fallow audit diffs against the PR's base branch, so it needs history.
          fetch-depth: 0
          filter: blob:none
      # Reads the pnpm version from package.json's packageManager field.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 26.12.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Restore Turbo cache
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ runner.arch }}-node26-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ runner.arch }}-node26-${{ github.ref }}-
            turbo-${{ runner.os }}-${{ runner.arch }}-node26-refs/heads/main-

      - name: Format
        run: pnpm format:check
      - name: Lint
        run: pnpm lint --format github
      - name: Typecheck
        run: pnpm typecheck ${{ github.event_name == 'pull_request' && '--affected' || '' }}
      - name: Gateway tests with coverage
        run: pnpm --filter gateway test:coverage
      - name: Fallow audit (findings this PR introduces)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: >-
          pnpm fallow audit --base "origin/$BASE_REF"
          --coverage apps/gateway/coverage/coverage-final.json --format github-annotations

      - name: Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter storybook exec playwright --version | cut -d ' ' -f 2)" >> "$GITHUB_OUTPUT"
      - name: Cache Chromium
        id: browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-ubuntu-chromium-${{ steps.playwright.outputs.version }}
      - name: Install Chromium for story tests
        if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm --filter storybook exec playwright install --with-deps chromium
      - name: Install Chromium system dependencies
        if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm --filter storybook exec playwright install-deps chromium
      - name: Unit and story tests
        run: pnpm test --filter='!gateway' ${{ github.event_name == 'pull_request' && '--affected' || '' }}
      - name: Build
        run: pnpm build ${{ github.event_name == 'pull_request' && '--affected' || '' }}
      - name: Build Storybook
        # Always restore the Storybook output for the artifact, even on unrelated PRs.
        run: pnpm build-storybook

      - name: Upload failed-story screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failed-story-screenshots
          path: apps/storybook/**/__screenshots__/
          if-no-files-found: ignore
      - name: Upload Storybook
        uses: actions/upload-artifact@v7
        with:
          name: storybook-static
          path: apps/storybook/storybook-static/
